<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vilamoura 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>🏌️ Vilamoura 2026</h1>
        <p>North vs South</p>
    </header>

    <main>

    <section class="card">
        <h2>🏆 Tournament Schedule</h2>
        <div id="schedule">
            Loading schedule...
        </div>
    </section>

    <section class="card">
        <h2>👥 Teams</h2>
        <div id="teams">
            Loading teams...
        </div>
    </section>

    <section class="card">
        <h2>📊 Individual Leaderboard</h2>
        <div id="leaderboard">
            No scores entered yet
        </div>
    </section>

    <section class="card">
        <h2>🏌️ Ryder Cup</h2>
        <div id="rydercup">
            North 0<br>
            South 0
        </div>
    </section>

    <section class="card">
        <h2>Players</h2>
        <div id="players">
            Loading players...
        </div>
    </section>

    <section class="card">
        <h2>Courses</h2>
        <div id="courses">
            Loading courses...
        </div>
    </section>

</main>

    <script src="app.js"></script>

</body>
</html>
