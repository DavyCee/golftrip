<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vilamoura 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
    <h1 id="eventTitle">🏌️ Loading...</h1>
    <p id="eventTeams">Loading...</p>
    </header>

    <main>
   
    <section class="card" id="villaInfo">
    </section>

        
    <section class="card">
        <h2>🏆 Tournament Schedule</h2>
        <div id="schedule">
            Loading schedule...
        </div>
    </section>

    <section class="card">
        <h2>⚔️ Teams</h2>
        <div id="teams">
            Loading teams...
        </div>
    </section>

<section class="card">
    <h2>📈 Course Handicaps</h2>

    <select id="courseSelect">
        <option>Vale do Lobo Royal</option>
        <option>Pinhal</option>
        <option>Vale do Lobo Ocean</option>
    </select>

    <div id="handicapTable">
        Loading handicaps...
    </div>
</section>

   <section class="card">
    <h2>📋 Player Scorecard</h2>

    <select id="scorecardPlayer"></select>

    <select id="scorecardCourse">
        <option value="1">Round 1</option>
        <option value="2">Round 2</option>
        <option value="3">Round 3</option>
    </select>

    <div id="scorecard"></div>
</section>
        
    <section class="card">
        <h2>📊 Individual Leaderboard</h2>
        <div id="leaderboard">
            No scores entered yet
        </div>
    </section>

    <section class="card">
        <h2>🏌️ Ryder Cup</h2>
        <div id="rydercup">
            Loading...<br>
        </div>
    </section>

</main>

    <script src="app.js"></script>

</body>
</html>
